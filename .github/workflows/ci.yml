name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with black
      run: |
        black --check --diff .
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports app.py rag_engine.py utils/
      continue-on-error: true  # mypy пока в бета-режиме
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml
      continue-on-error: true  # тесты добавим позже
    
    - name: Check Docker image size
      run: |
        docker build -t bioagent-test .
        SIZE=$(docker image inspect bioagent-test --format='{{.Size}}')
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "Docker image size: ${SIZE_MB}MB"
        if [ $SIZE_MB -gt 2048 ]; then
          echo "❌ Docker image too large (>2GB)"
          exit 1
        fi
